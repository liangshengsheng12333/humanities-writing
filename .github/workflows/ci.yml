name: CI & Integrity Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python syntax & basic tool sanity
        run: |
          python -m py_compile scripts/review.py
          python -m py_compile scripts/search.py
          python scripts/review.py --help
          python scripts/search.py --help
          python scripts/search.py --list-sources

      - name: Test review.py on sample text
        run: |
          echo "这是一个包含必要辨析的学术论证测试片段。" > test_input.txt
          python scripts/review.py test_input.txt --mode academic
          python scripts/review.py test_input.txt --mode general
          rm test_input.txt
